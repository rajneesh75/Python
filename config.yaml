utility_agents:
  - agent_class: SearchAgent
    agent_name: "Cricket ground finding Agent"
    agent_description:
      This agent finds the cricket grounds in any location in New Delhi, India.
      Do not ask this agent any question that is not related to this scope.
    config:
      output_style: "conversational"
      contexts:
        - "chat_history"

orchestrator:
  agent_list:
    - agent_name: "Cricket ground finding Agent"