<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Django Home</title>
</head>
<body>
<h1>Welcome to Django 🚀</h1>
<p>This is a template page.</p>
<h1>Task List ✅</h1>

<ul>
    {% for task in tasks %}
    <li>
        {{ task.title }} -
        {% if task.is_done %}Done ✅{% else %}Pending ⏳{% endif %}
    </li>
    {% empty %}
    <li>No tasks yet</li>
    {% endfor %}
</ul>
<h2>Add a Task</h2>

<form method="POST">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Add</button>
</form>
</body>
</html>
